spring.main.lazy-initialization=false
spring.datasource.url=jdbc:mariadb://${DB_HOST:[2a09:8280:1::121:fe41:0]}:${DB_PORT:3306}/${DB_NAME:socialcoiso}?sslMode=DISABLED&serverTimezone=UTC
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER:socialcoiso}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.flyway.validate-on-migrate=false

# Migrations escritas em paralelo (branchs/sessoes concorrentes) podem ter numero menor que uma ja
# aplicada. Sem isso o Flyway recusa e o pod nao sobe. Ordem fora de serie e aceita de proposito.
spring.flyway.out-of-order=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=5

# QA também não confia em localhost por padrão (E-31).
rede.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://enois-qa.b7cloud.tech}


# OAuth no ambiente de QA: os callbacks apontam para os hosts do sandbox (fixos de proposito: o
# callback do Google nao muda de host sem mudar o cadastro no provedor). As credenciais
# (GOOGLE_CLIENT_ID/SECRET) vem do ambiente, nunca do repositorio.
#
# Estas chaves apareciam DUAS vezes neste arquivo (o bloco generico com ${REDE_FRONTEND_URL} e
# este). Em .properties a ULTIMA ocorrencia vence: quem editasse o bloco generico nao veria
# efeito nenhum. O valor efetivo e o de antes, chave por chave.
rede.oauth.frontend-redirect-url=https://enois-qa.b7cloud.tech/auth/callback
rede.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
rede.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
rede.oauth.google.redirect-uri=https://enois-api-qa.b7cloud.tech/api/auth/oauth/google/callback
rede.oauth.google.enabled=true
rede.oauth.apple.client-id=${APPLE_CLIENT_ID:}
rede.oauth.apple.team-id=${APPLE_TEAM_ID:}
rede.oauth.apple.key-id=${APPLE_KEY_ID:}
rede.oauth.apple.private-key=${APPLE_PRIVATE_KEY:}
rede.oauth.apple.redirect-uri=${REDE_BACKEND_URL}/api/auth/oauth/apple/callback

# Cadastros ABERTOS com captcha + confirmacao de e-mail ANTES de criar a conta (2026-10-21):
# o POST /auth/signup guarda em pending_signups e envia o link; a conta so nasce na confirmacao.
# Fechar de novo: REDE_AUTH_SIGNUP_ENABLED=false (responde 403 SIGNUP_DISABLED).
rede.auth.signup-enabled=${REDE_AUTH_SIGNUP_ENABLED:true}

# As TURNSTILE_* da QA sao as chaves PUBLICAS de teste da Cloudflare (aceitam qualquer token).
# Elas nunca contam como captcha ativo — o cadastro cai no desafio proprio do backend —, e o boot
# nao pode ser recusado por isso: derrubar a QA inteira por um captcha de teste aconteceu em
# 2026-10-26. Explicita aqui para ninguem descobrir o contrario por acidente.
rede.turnstile.test-key-policy=degrade


# (requestId, traceId, clientIp, userId, http.route, http.status...). Também serve Loki/Grafana.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=qa
