version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Uma PR por família: o Spring Boot precisa subir inteiro, e vinte PRs de patch ninguém revisa.
      spring:
        patterns: ["org.springframework*", "org.springframework.boot*"]
      testes:
        patterns: ["org.junit*", "org.assertj*", "org.mockito*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  # Base images are pinned by digest in the Dockerfile; this keeps the digests fresh.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
